<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Sample - SoilTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #F4F1EB; font-family: 'Segoe UI', sans-serif; }
        .sidebar { min-height: 100vh; background-color: #4A7C59; padding-top: 20px; position: fixed; width: 220px; top: 0; left: 0; }
        .sidebar .logo { color: #fff; font-size: 20px; font-weight: 700; padding: 10px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 10px; }
        .sidebar .logo span { font-size: 12px; display: block; font-weight: 400; opacity: 0.7; margin-top: 2px; }
        .sidebar a { color: rgba(255,255,255,0.85); text-decoration: none; display: block; padding: 10px 20px; font-size: 14px; transition: all 0.15s; }
        .sidebar a:hover { background-color: #3A6B4A; color: #fff; }
        .sidebar a.active { background-color: #3A6B4A; color: #fff; font-weight: 600; }
        .sidebar .nav-section { color: rgba(255,255,255,0.4); font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 15px 20px 5px; }
        .sidebar-bottom { position: absolute; bottom: 0; width: 100%; border-top: 1px solid rgba(255,255,255,0.2); padding: 10px 0; }
        .main-content { margin-left: 220px; padding: 30px; }
        .topbar { background: white; padding: 15px 30px; border-bottom: 1px solid #DDD9CF; margin-left: 220px; position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
        .topbar-title { font-size: 18px; font-weight: 700; color: #1A1814; }
        .card { border: 1px solid #DDD9CF; border-radius: 12px; background: white; padding: 24px; max-width: 800px; }
        .section-title { font-size: 11px; font-weight: 700; color: #9A9485; text-transform: uppercase; letter-spacing: 0.8px; padding-bottom: 10px; border-bottom: 1px solid #DDD9CF; margin-bottom: 16px; margin-top: 24px; }
        label { font-size: 12px; font-weight: 700; color: #5C5849; margin-bottom: 4px; display: block; }
        input, select { font-size: 13px; border: 1px solid #CEC8BE; border-radius: 8px; padding: 8px 11px; width: 100%; outline: none; transition: border-color 0.15s; background: white; }
        input:focus, select:focus { border-color: #4A7C59; box-shadow: 0 0 0 3px rgba(74,124,89,0.1); }
        .hint { font-size: 11px; color: #9A9485; margin-top: 3px; }
        .id-preview { background: #E6F2EA; border: 1px solid #BCD8C4; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; }
        .id-preview-label { font-size: 10px; font-weight: 700; color: #2D5A3D; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
        .id-preview-val { font-family: monospace; font-size: 18px; font-weight: 700; color: #2D5A3D; }
        .btn-save { background: #4A7C59; color: white; border: none; border-radius: 8px; padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
        .btn-save:hover { background: #3A6B4A; }
        .btn-cancel { background: white; color: #5C5849; border: 1px solid #CEC8BE; border-radius: 8px; padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; }

        /* Year toggle styles */
        .date-toggle { display: flex; gap: 6px; margin-bottom: 8px; }
        .toggle-btn { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 6px; border: 1.5px solid #CEC8BE; background: white; color: #9A9485; cursor: pointer; transition: all 0.15s; }
        .toggle-btn.active { background: #4A7C59; color: white; border-color: #4A7C59; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="logo">🌱 SoilTrack<span>Chemistry Department</span></div>
    <div class="nav-section">Main</div>
    <a href="/">📊 Dashboard</a>
    <a href="/samples">📋 All Samples</a>
    <a href="/add" class="active">➕ Add Sample</a>
    <div class="nav-section">Export</div>
    <a href="/export">⬇ Export to Excel</a>
    <div class="sidebar-bottom">
        <div class="nav-section">Account</div>
        <a href="/logout">🚪 Logout</a>
    </div>
</div>
<div class="topbar">
    <div class="topbar-title">Add New Sample</div>
</div>
<div class="main-content">
    <div class="card">
        <div class="id-preview">
            <div class="id-preview-label">Auto-Generated Sample ID</div>
            <div class="id-preview-val" id="id-preview">???-01</div>
        </div>
        <form method="POST" action="/add">
            <div class="section-title">Location & Owner Info</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label>Village Name</label>
                    <input type="text" name="village" id="village-input" required placeholder="e.g. Ratnagiri" oninput="updateID(this.value)">
                </div>
                <div class="col-md-6">
                    <label>Sample Source</label>
                    <select name="sample_source" id="sample-source-select" onchange="toggleScheme(this.value)">
                        <option value="govt">Government</option>
                        <option value="private">Private</option>
                    </select>
                </div>
                <div class="col-md-6" id="scheme-wrapper" style="display:none;">
                    <label>Scheme</label>
                    <input type="text" name="scheme" list="scheme-options" placeholder="Select or type a scheme name">
                    <datalist id="scheme-options">
                        <option value="PM-KISAN">
                        <option value="Soil Health Card Scheme">
                        <option value="PMKSY">
                        <option value="RKVY">
                        <option value="Paramparagat Krishi Vikas Yojana">
                    </datalist>
                    <div class="hint">Pick a common scheme or type a new one</div>
                </div>
                <div class="col-md-6">
                    <label>Farmer / Owner Name</label>
                    <input type="text" name="farmer_name" placeholder="e.g. Suresh Patil">
                </div>
                <div class="col-md-6">
                    <label>Phone Number</label>
                    <input type="tel" name="phone_number" placeholder="e.g. 9876543210">
                </div>
                <div class="col-md-6">
                    <label>Address</label>
                    <input type="text" name="address" placeholder="e.g. Post Ratnagiri, Tal. Ratnagiri">
                </div>
                <div class="col-md-6">
                    <label>Survey Number</label>
                    <input type="text" name="survey_number" placeholder="e.g. 145/2A">
                </div>
                <div class="col-md-6">
                    <label>Collection Year / Date</label>
                    <!-- Toggle buttons -->
                    <div class="date-toggle">
                        <button type="button" class="toggle-btn active" id="btn-year" onclick="switchMode('year')">📅 Year Range</button>
                        <button type="button" class="toggle-btn" id="btn-date" onclick="switchMode('date')">🗓 Exact Date</button>
                    </div>
                    <!-- Year range input -->
                    <input type="text" name="collection_date" id="input-year" placeholder="e.g. 2025-2026" maxlength="9"
                           oninput="formatYear(this)">
                    <!-- Exact date input (hidden by default) -->
                    <input type="date" name="collection_date_exact" id="input-date" style="display:none;">
                    <div class="hint" id="date-hint">Enter year range like 2025-2026</div>
                </div>
            </div>

            <div style="margin-top:24px;display:flex;gap:10px">
                <button type="submit" class="btn-save">Save Sample</button>
                <a href="/samples" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function updateID(village) {
    const code = village.substring(0, 3).toUpperCase();
    document.getElementById('id-preview').textContent = code ? code + '-01' : '???-01';
}

function toggleScheme(sourceValue) {
    const wrapper = document.getElementById('scheme-wrapper');
    wrapper.style.display = (sourceValue === 'govt') ? '' : 'none';
}

// Run once on page load in case browser restores a previous selection
document.addEventListener('DOMContentLoaded', function () {
    const select = document.getElementById('sample-source-select');
    toggleScheme(select.value);
});

let currentMode = 'year';

function switchMode(mode) {
    currentMode = mode;
    const yearInput = document.getElementById('input-year');
    const dateInput = document.getElementById('input-date');
    const hint = document.getElementById('date-hint');

    document.getElementById('btn-year').classList.toggle('active', mode === 'year');
    document.getElementById('btn-date').classList.toggle('active', mode === 'date');

    if (mode === 'year') {
        yearInput.style.display = '';
        yearInput.name = 'collection_date';
        dateInput.style.display = 'none';
        dateInput.name = 'collection_date_exact';
        hint.textContent = 'Enter year range like 2025-2026';
    } else {
        yearInput.style.display = 'none';
        yearInput.name = 'collection_date_hidden';
        dateInput.style.display = '';
        dateInput.name = 'collection_date';
        hint.textContent = 'Select exact collection date';
    }
}

function formatYear(input) {
    // Auto-format: type 2025 → auto adds hyphen → 2025-
    let val = input.value.replace(/[^0-9\-]/g, '');
    if (val.length === 4 && !val.includes('-')) {
        val = val + '-';
    }
    input.value = val;
}
</script>
</body>
</html>

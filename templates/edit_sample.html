<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Sample - SoilTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #F4F1EB; font-family: 'Segoe UI', sans-serif; }
        .sidebar { min-height: 100vh; background-color: #4A7C59; padding-top: 20px; position: fixed; width: 220px; top: 0; left: 0; }
        .sidebar .logo { color: #fff; font-size: 20px; font-weight: 700; padding: 10px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 10px; }
        .sidebar .logo span { font-size: 12px; display: block; font-weight: 400; opacity: 0.7; margin-top: 2px; }
        .sidebar a { color: rgba(255,255,255,0.85); text-decoration: none; display: block; padding: 10px 20px; font-size: 14px; transition: all 0.15s; }
        .sidebar a:hover { background-color: #3A6B4A; color: #fff; }
        .sidebar a.active { background-color: #3A6B4A; color: #fff; font-weight: 600; }
        .sidebar .nav-section { color: rgba(255,255,255,0.4); font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 15px 20px 5px; }
        .sidebar-bottom { position: absolute; bottom: 0; width: 100%; border-top: 1px solid rgba(255,255,255,0.2); padding: 10px 0; }
        .main-content { margin-left: 220px; padding: 30px; }
        .topbar { background: white; padding: 15px 30px; border-bottom: 1px solid #DDD9CF; margin-left: 220px; position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
        .topbar-title { font-size: 18px; font-weight: 700; color: #1A1814; }
        .card { border: 1px solid #DDD9CF; border-radius: 12px; background: white; padding: 24px; max-width: 800px; }
        .section-title { font-size: 11px; font-weight: 700; color: #9A9485; text-transform: uppercase; letter-spacing: 0.8px; padding-bottom: 10px; border-bottom: 1px solid #DDD9CF; margin-bottom: 16px; margin-top: 24px; }
        label { font-size: 12px; font-weight: 700; color: #5C5849; margin-bottom: 4px; display: block; }
        input, select { font-size: 13px; border: 1px solid #CEC8BE; border-radius: 8px; padding: 8px 11px; width: 100%; outline: none; transition: border-color 0.15s; background: white; }
        input:focus, select:focus { border-color: #4A7C59; box-shadow: 0 0 0 3px rgba(74,124,89,0.1); }
        .hint { font-size: 11px; color: #9A9485; margin-top: 3px; }
        .id-preview { background: #E6F2EA; border: 1px solid #BCD8C4; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; }
        .id-preview-label { font-size: 10px; font-weight: 700; color: #2D5A3D; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
        .id-preview-val { font-family: monospace; font-size: 18px; font-weight: 700; color: #2D5A3D; }
        .btn-save { background: #4A7C59; color: white; border: none; border-radius: 8px; padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-cancel { background: white; color: #5C5849; border: 1px solid #CEC8BE; border-radius: 8px; padding: 10px 24px; font-size: 14px; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="logo">🌱 SoilTrack<span>Chemistry Department</span></div>
    <div class="nav-section">Main</div>
    <a href="/">📊 Dashboard</a>
    <a href="/samples" class="active">📋 All Samples</a>
    <a href="/add">➕ Add Sample</a>
    <div class="nav-section">Export</div>
    <a href="/export">⬇ Export to Excel</a>
    <div class="sidebar-bottom">
        <div class="nav-section">Account</div>
        <a href="/logout">🚪 Logout</a>
    </div>
</div>
<div class="topbar">
    <div class="topbar-title">Edit Sample</div>
</div>
<div class="main-content">
    <div class="card">
        <div class="id-preview">
            <div class="id-preview-label">Sample ID</div>
            <div class="id-preview-val">{{ sample.sample_id }}</div>
        </div>
        <form method="POST" action="/edit/{{ sample.id }}">
            <div class="section-title">Location & Owner Info</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label>Village Name</label>
                    <input type="text" name="village" value="{{ sample.village }}" required>
                </div>
                <div class="col-md-6">
                    <label>Sample Source</label>
                    <select name="sample_source" id="sample-source-select" onchange="toggleScheme(this.value)">
                        <option value="govt" {% if sample.sample_source == 'govt' %}selected{% endif %}>Government</option>
                        <option value="private" {% if sample.sample_source == 'private' %}selected{% endif %}>Private</option>
                    </select>
                </div>
                <div class="col-md-6" id="scheme-wrapper" style="display:none;">
                    <label>Scheme</label>
                    <input type="text" name="scheme" value="{{ sample.scheme or '' }}" list="scheme-options" placeholder="Select or type a scheme name">
                    <datalist id="scheme-options">
                        <option value="PM-KISAN">
                        <option value="Soil Health Card Scheme">
                        <option value="PMKSY">
                        <option value="RKVY">
                        <option value="Paramparagat Krishi Vikas Yojana">
                    </datalist>
                    <div class="hint">Pick a common scheme or type a new one</div>
                </div>
                <div class="col-md-6">
                    <label>Farmer / Owner Name</label>
                    <input type="text" name="farmer_name" value="{{ sample.farmer_name }}">
                </div>
                <div class="col-md-6">
                    <label>Phone Number</label>
                    <input type="tel" name="phone_number" value="{{ sample.phone_number or '' }}">
                </div>
                <div class="col-md-6">
                    <label>Address</label>
                    <input type="text" name="address" value="{{ sample.address or '' }}">
                </div>
                <div class="col-md-6">
                    <label>Survey Number</label>
                    <input type="text" name="survey_number" value="{{ sample.survey_number or '' }}">
                </div>
                <div class="col-md-6">
                    <label>Collection Date</label>
                    <input type="text" name="collection_date" value="{{ sample.collection_date }}">
                </div>
            </div>
            <div style="margin-top:24px;display:flex;gap:10px">
                <button type="submit" class="btn-save">Update Sample</button>
                <a href="/sample/{{ sample.id }}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function toggleScheme(sourceValue) {
    const wrapper = document.getElementById('scheme-wrapper');
    wrapper.style.display = (sourceValue === 'govt') ? '' : 'none';
}
document.addEventListener('DOMContentLoaded', function () {
    const select = document.getElementById('sample-source-select');
    toggleScheme(select.value);
});
</script>
</body>
</html>
